---
name: MLOps Pipeline CI/CD

'on':
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || exit 1

      - name: Run training
        run: |
          python src/train.py || exit 1

      - name: Build Docker image
        run: |
          docker build -t awani86/mlops-model:latest . || exit 1

      - name: Run Docker container
        run: |
          docker run awani86/mlops-model:latest || exit 1

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push awani86/mlops-model:latest || exit 1
