name: MLOps Pipeline CI/CD

on: [push]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Train model
      run: python src/train.py
      
    - name: Build Docker image
      run: docker build -t mlops-assignment3 .
      
    - name: Test Docker container
      run: docker run mlops-assignment3
      
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/docker_ci'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Push to Docker Hub
      if: github.ref == 'refs/heads/docker_ci'
      run: |
        docker tag mlops-assignment3 ${{ secrets.DOCKER_HUB_USERNAME }}/mlops-assignment3:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mlops-assignment3:latest